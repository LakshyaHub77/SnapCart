services:

  next1:
    build:
      context: .
    image: snapcart
    container_name: next1
    env_file:
      - .env.local
    expose:
      - "3000"

  next2:
    image: snapcart
    container_name: next2
    env_file:
      - .env.local
    expose:
      - "3000"

  next3:
    image: snapcart
    container_name: next3
    env_file:
      - .env.local
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: snapcart-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - next1
      - next2
      - next3